version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      test:
        patterns:
          - "org.junit*:*"
          - "org.mockito*:*"
          - "org.assertj:*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly