version: 2
updates:
  # Maven 工程位于子目录，directory 必须指向 pom.xml 所在目录
  - package-ecosystem: maven
    directory: "/access-monitor-spring-boot-starter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      test:
        patterns:
          - "org.junit*:*"
          - "org.mockito*:*"
          - "org.assertj:*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
