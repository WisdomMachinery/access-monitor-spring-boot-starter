name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# 工程位于子目录，run 步骤统一切到工程目录
defaults:
  run:
    working-directory: access-monitor-spring-boot-starter

jobs:
  release:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Verify tag matches pom version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout | tr -d '\r\n')"
          echo "tag=$TAG_VERSION pom=$POM_VERSION"
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "::error::标签 $TAG_VERSION 与 pom.xml 中的版本 $POM_VERSION 不一致"
            exit 1
          fi

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B --no-transfer-progress -Prelease deploy -DskipTests

      # 包发布成功后再建 GitHub Release（说明取自带注释的 tag message）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
