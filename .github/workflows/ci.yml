name: CI

# 本仓库的工程位于子目录 access-monitor-spring-boot-starter/，
# GitHub 只认仓库根目录下的 .github/workflows，因此工作流放在根目录，
# 再用 defaults 把 run 步骤切到工程目录。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: access-monitor-spring-boot-starter

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify
